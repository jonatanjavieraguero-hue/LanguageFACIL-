<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Inglés Fácil | Clases Online y Presencial</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fraunces:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #100823;
            --primary: #7C3AED;
            --coral: #FB923C;
            --teal: #14B8A6;
            --surface: #FAFAF9;
            --text: #1E293B;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text);
            margin: 0;
            overflow-x: hidden;
        }

        /* Barra de Idiomas */
        .lang-bar {
            background: var(--navy);
            padding: 0.5rem 5vw;
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 2rem;
            cursor: pointer;
            padding: 0.25rem 0.75rem;
        }

        .lang-btn.active { background: var(--primary); border-color: var(--primary); }

        /* Navegación */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(14px);
            padding: 1rem 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        .nav-logo { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.25rem; text-decoration: none; color: var(--navy); }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--navy) 0%, #2D1265 100%);
            color: white;
            padding: 5rem 5vw;
            text-align: center;
        }

        .hero h1 { font-family: 'Fraunces', serif; font-size: 3.5rem; margin-bottom: 1rem; }
        .hero h1 em { font-style: italic; color: #A78BFA; }
        
        .btn-coral {
            background: var(--coral);
            color: white;
            padding: 1rem 2rem;
            border-radius: 2rem;
            text-decoration: none;
            font-weight: 700;
            display: inline-block;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="lang-bar">
        <button class="lang-btn active" onclick="switchLang('es', this)">ES</button>
        <button class="lang-btn" onclick="switchLang('en', this)">EN</button>
    </div>

    <nav>
        <a href="#" class="nav-logo">✨ Inglés Fácil</a>
        <div class="nav-links">
            <a href="#contacto" class="btn-coral" style="padding: 0.5rem 1.5rem;">¡Clase Gratis!</a>
        </div>
    </nav>

    <header class="hero">
        <h1 data-es="Aprende inglés <em>sin estrés</em>" data-en="Learn English <em>stress-free</em>">Aprende inglés <em>sin estrés</em></h1>
        <p data-es="Clases personalizadas para hablar desde el primer día." data-en="Personalized classes to speak from day one.">Clases personalizadas para hablar desde el primer día.</p>
        <a href="https://wa.me/50672590240" class="btn-coral">Empezar ahora</a>
    </header>

    <script>
        function switchLang(lang, btn) {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('[data-es]').forEach(el => {
                el.innerHTML = el.getAttribute('data-' + lang);
            });
        }
    </script>
</body>
</html>
